# The committed example app builds on EAS, under the expo-ci CI project. This is the one path neither
# GitHub CI nor the live tier can take — llp/0022 marks native EAS build creation "unreachable in v1"
# — so it keeps a real Android build green on a real account.
#
# It builds apps/eas-example, which is already a linked, build-ready target: its app.json names the
# projectId and android.package, and its eas.json has the profile. agent-cli has no EAS build command
# by design, so the build itself is eas-cli; everything the old scaffold path did around it — create,
# link, patch config, git init — is gone now that the app is a real, committed target.
#
# Runs on demand and on any PR that changes the app or the lockfile. Each run spends Android build
# minutes on expo-ci — accepted here, unlike the tier-2 evals, which stay label-gated because they
# also bill Anthropic tokens.
name: agent-cli-eas-build

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - apps/eas-example/**
      - bun.lock

# Base dir is packages/@expo/agent-cli; the monorepo lives three levels up, so steps run from the repo
# root where the bun workspace resolves, and the build step cds into the app. `tools` pins Node and
# Bun — recent eas-cli wants Node 20+ and the runner's default is older.
defaults:
  run:
    working_directory: ../../..
  tools:
    node: 24
    bun: 1.3.14

jobs:
  eas-build:
    name: build eas-example on EAS
    runs_on: linux-medium
    environment: production
    steps:
      - uses: eas/checkout

      - name: Install dependencies
        run: bun install --ignore-scripts --frozen-lockfile

      - name: Build eas-example on EAS
        run: |
          set -euo pipefail
          cd apps/eas-example
          # A real Android build of the committed app. eas generates a keystore non-interactively,
          # waits for the build, and exits non-zero if it fails — that exit code is the whole assertion.
          npx --yes eas-cli@latest build --platform android --profile preview --non-interactive
