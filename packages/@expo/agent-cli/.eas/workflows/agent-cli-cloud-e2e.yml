# Spike: run agent-cli's `--cloud` e2e suite (live-cloud) on EAS, against a real EAS Simulator session.
# This is the coverage GitHub CI cannot take. A cloud simulator runs in a datacenter, so the app's dev
# server has to be reachable over a public origin; locally that comes from `tuft host`, which no CI
# runner has. Here a cloudflared quick tunnel provides it, and the tested suite runs unchanged through
# its `AGENT_CLI_LIVE_PUBLIC_ORIGIN` escape hatch. There is no macOS gate on live-cloud — the device is
# remote — so a Linux runner is fine.
#
# Manual for now (workflow_dispatch). Each run that reaches the session bills one EAS Simulator session.
# If the tunnel never reaches the world the suite fails at `navigate --print-url`, before any session is
# billed, so a broken tunnel is a cheap failure.
name: agent-cli-cloud-e2e

on:
  workflow_dispatch: {}

# Base dir is packages/@expo/agent-cli; the monorepo is three levels up. Steps run from the repo root so
# the bun workspace resolves; the last step cds into the package to run the suite. Node 24 because the
# suite scaffolds an app with create-expo, which needs the Node 20+ `File` global.
defaults:
  run:
    working_directory: ../../..
  tools:
    node: 24
    bun: 1.3.14

jobs:
  cloud-e2e:
    name: live-cloud on EAS
    runs_on: linux-medium
    environment: production
    steps:
      - uses: eas/checkout

      - name: Install dependencies
        run: bun install --ignore-scripts --frozen-lockfile

      - name: Build @expo/agent-cli
        run: bun run --filter @expo/agent-cli build

      - name: Run live-cloud over a cloudflared tunnel
        run: |
          set -euo pipefail
          PORT=8500

          # A public origin the cloud simulator can reach. cloudflared quick tunnels need no account and
          # print a *.trycloudflare.com URL that forwards to the local port.
          curl -fsSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --no-autoupdate --url "http://localhost:${PORT}" > /tmp/cf.log 2>&1 &
          CF_PID=$!
          trap 'kill "${CF_PID}" 2>/dev/null || true' EXIT

          ORIGIN=""
          for _ in $(seq 1 30); do
            ORIGIN="$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1 || true)"
            [ -n "${ORIGIN}" ] && break
            sleep 2
          done
          if [ -z "${ORIGIN}" ]; then
            echo "cloudflared never printed a tunnel URL:"
            cat /tmp/cf.log
            exit 1
          fi
          echo "tunnel origin: ${ORIGIN}"

          cd packages/@expo/agent-cli
          AGENT_CLI_LIVE_EAS=1 \
          AGENT_CLI_LIVE_CLOUD=1 \
          AGENT_CLI_LIVE_PUBLIC_ORIGIN="${ORIGIN}" \
          AGENT_CLI_LIVE_PORT="${PORT}" \
            bun run test:live:cloud
