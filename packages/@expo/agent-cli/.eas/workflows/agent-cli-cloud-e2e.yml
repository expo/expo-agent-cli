# Run agent-cli's `--cloud` e2e suite (live-cloud) on EAS, against real EAS Simulator sessions. This is
# the coverage GitHub CI cannot take: a cloud simulator runs in a datacenter, so the app's dev server
# has to be reachable over a public origin. The suite makes that origin itself: it starts its dev
# server with `--tunnel` under `EXPO_UNSTABLE_TUNNEL_V2=1` (`@expo/ws-tunnel` on the job's own EAS
# auth — no ngrok, no cloudflared), so the tunnel is part of the tested surface. There is no macOS
# gate on live-cloud (the device is remote), so a Linux runner is fine.
#
# Four parallel jobs, {iOS, Android} × {Expo Go, dev build}, no `needs` between them so EAS runs them at
# once. The Expo Go jobs scaffold an app and run it in Expo Go; the dev-build jobs first build a real
# development client of apps/eas-example on EAS (an `ios.simulator: true` build needs no code signing),
# then the session installs and runs that client — which subsumes the old `agent-cli-eas-build` (a real
# native EAS build). Each job that reaches its session bills one EAS Simulator session; a broken tunnel
# fails at the origin check before any session is billed. It runs on demand (workflow_dispatch) and on
# every PR — unfiltered on purpose [decided 2026-09-05]: a path filter only sees changes on our side,
# while EAS Simulator readiness, the Expo Go a session installs, and create-expo's scaffold all move
# without touching this repo, and a PR is when somebody is looking. Four billed sessions per PR push.
name: agent-cli-cloud-e2e

on:
  workflow_dispatch: {}
  pull_request: {}

# Base dir is packages/@expo/agent-cli; the monorepo is three levels up. Steps run from the repo root so
# the bun workspace resolves; the last step cds into the package to run the suite. Node 24 because the
# Expo Go jobs scaffold an app with create-expo, which needs the Node 20+ `File` global.
defaults:
  run:
    working_directory: ../../..
  tools:
    node: 24
    bun: 1.3.14

jobs:
  cloud-e2e-expo-go-ios:
    name: live-cloud on EAS (iOS, Expo Go)
    runs_on: linux-medium
    environment: production
    env:
      AGENT_CLI_LIVE_CLOUD_PLATFORM: ios
      AGENT_CLI_LIVE_CLOUD_MODE: expo-go
    steps:
      - uses: eas/checkout
      - name: Install dependencies
        run: bun install --ignore-scripts --frozen-lockfile
      - name: Build @expo/agent-cli
        run: bun run --filter @expo/agent-cli build
      - name: Run live-cloud over the dev server's own tunnel
        run: |
          set -euo pipefail
          cd packages/@expo/agent-cli
          AGENT_CLI_LIVE_EAS=1 \
          AGENT_CLI_LIVE_CLOUD=1 \
            bun run test:live:cloud

  cloud-e2e-expo-go-android:
    name: live-cloud on EAS (Android, Expo Go)
    runs_on: linux-medium
    environment: production
    env:
      AGENT_CLI_LIVE_CLOUD_PLATFORM: android
      AGENT_CLI_LIVE_CLOUD_MODE: expo-go
    steps:
      - uses: eas/checkout
      - name: Install dependencies
        run: bun install --ignore-scripts --frozen-lockfile
      - name: Build @expo/agent-cli
        run: bun run --filter @expo/agent-cli build
      - name: Run live-cloud over the dev server's own tunnel
        run: |
          set -euo pipefail
          cd packages/@expo/agent-cli
          AGENT_CLI_LIVE_EAS=1 \
          AGENT_CLI_LIVE_CLOUD=1 \
            bun run test:live:cloud

  cloud-e2e-dev-build-ios:
    name: live-cloud on EAS (iOS, dev build)
    runs_on: linux-medium
    environment: production
    env:
      AGENT_CLI_LIVE_CLOUD_PLATFORM: ios
      AGENT_CLI_LIVE_CLOUD_MODE: dev-build
    steps:
      - uses: eas/checkout
      - name: Install dependencies
        run: bun install --ignore-scripts --frozen-lockfile
      - name: Build @expo/agent-cli
        run: bun run --filter @expo/agent-cli build
      - name: Build the dev client on EAS
        run: |
          set -euo pipefail
          cd apps/eas-example
          npx --yes eas-cli@latest build --platform "${AGENT_CLI_LIVE_CLOUD_PLATFORM}" --profile development --non-interactive
      - name: Run live-cloud over the dev server's own tunnel
        run: |
          set -euo pipefail
          cd packages/@expo/agent-cli
          AGENT_CLI_LIVE_EAS=1 \
          AGENT_CLI_LIVE_CLOUD=1 \
            bun run test:live:cloud

  cloud-e2e-dev-build-android:
    name: live-cloud on EAS (Android, dev build)
    runs_on: linux-medium
    environment: production
    env:
      AGENT_CLI_LIVE_CLOUD_PLATFORM: android
      AGENT_CLI_LIVE_CLOUD_MODE: dev-build
    steps:
      - uses: eas/checkout
      - name: Install dependencies
        run: bun install --ignore-scripts --frozen-lockfile
      - name: Build @expo/agent-cli
        run: bun run --filter @expo/agent-cli build
      - name: Build the dev client on EAS
        run: |
          set -euo pipefail
          cd apps/eas-example
          npx --yes eas-cli@latest build --platform "${AGENT_CLI_LIVE_CLOUD_PLATFORM}" --profile development --non-interactive
      - name: Run live-cloud over the dev server's own tunnel
        run: |
          set -euo pipefail
          cd packages/@expo/agent-cli
          AGENT_CLI_LIVE_EAS=1 \
          AGENT_CLI_LIVE_CLOUD=1 \
            bun run test:live:cloud
