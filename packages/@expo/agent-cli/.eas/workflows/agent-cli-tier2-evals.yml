# @ref llp/0002-testing-and-evals.plan.md
# Advisory policy is a branch-protection choice; this job preserves actual failures.
name: agent-cli-tier2-evals
on:
  pull_request_labeled:
    labels: [agent-cli-eval]
  workflow_dispatch: {}

# The EAS base directory is packages/@expo/agent-cli.
# Configs resolve evals explicitly; scripts run from the package directory.
defaults:
  run:
    working_directory: .
  tools:
    node: 24
    bun: 1.3.14

jobs:
  tier2:
    name: tier 2 long web outcome
    runs_on: linux-medium
    environment: production
    env:
      AGENT_CLI_TIER2: '1'
    outputs:
      result: ${{ steps.report.outputs.result }}
      summary: ${{ steps.report.outputs.summary }}
    steps:
      - uses: eas/checkout
      - name: Initialize evidence
        id: paths
        run: |
          mkdir -p evals/artifacts/tier2
          printf '%s\n' '{"status":"error","reason":"Setup or test runner did not complete"}' > evals/artifacts/tier2/outcome.json
          printf '1\n' > evals/artifacts/tier2/runner-exit-code
          set-output artifacts "$PWD/evals/artifacts/tier2"
      - name: Check credentials before installing tools
        id: preflight
        run: node evals/tier2/preflight.mjs --eas
      - name: Install workspace dependencies
        if: ${{ steps.preflight.outputs.mode == 'run' }}
        working_directory: ../../..
        run: |
          set -eo pipefail
          bun install --ignore-scripts --frozen-lockfile 2>&1 | tee packages/@expo/agent-cli/evals/artifacts/tier2/workspace-install.log
      - name: Build CLI under test
        if: ${{ steps.preflight.outputs.mode == 'run' }}
        working_directory: ../../..
        run: |
          set -eo pipefail
          bun run --filter @expo/agent-cli build 2>&1 | tee packages/@expo/agent-cli/evals/artifacts/tier2/cli-build.log
      - name: Install pinned Tier2 tools
        if: ${{ steps.preflight.outputs.mode == 'run' }}
        run: |
          set -eo pipefail
          npm install --global @anthropic-ai/claude-code@2.1.267 2>&1 | tee evals/artifacts/tier2/claude-install.log
          tier2_tools=$(mktemp -d /tmp/agent-cli-tier2-tools.XXXXXX)
          npm install --prefix "$tier2_tools" --no-audit --no-fund playwright@1.55.0 2>&1 | tee evals/artifacts/tier2/playwright-install.log
          node "$tier2_tools/node_modules/playwright/cli.js" install --with-deps chromium 2>&1 | tee evals/artifacts/tier2/chromium-install.log
          set-env TIER2_PLAYWRIGHT_ROOT "$tier2_tools"
      - name: Run long Tier2 eval
        if: ${{ steps.preflight.outputs.mode == 'run' }}
        id: evals
        run: |
          set -o pipefail
          set +e
          bunx --no-install vitest run --config evals/tier2/vitest.config.mts 2>&1 | tee evals/artifacts/tier2/runner.log
          code=$?
          printf '%s\n' "$code" > evals/artifacts/tier2/runner-exit-code
          exit "$code"
      - name: Report outcome, errors, or skip
        id: report
        if: ${{ always() }}
        run: node evals/tier2/report.mjs --eas
      - name: Upload Tier2 evidence
        uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: agent-cli-tier2-evidence
          path: ${{ steps.paths.outputs.artifacts }}/**/*

  comment:
    name: Report Tier2 on PR
    after: [tier2]
    if: ${{ github.event.pull_request.number }}
    type: github-comment
    params:
      payload: |
        <!-- agent-cli-tier2-evals -->
        ## @expo/agent-cli Tier2: long web task
        Eval result: **${{ after.tier2.outputs.result || after.tier2.status }}**
        Job status (including setup and artifact upload): **${{ after.tier2.status }}**
        ${{ after.tier2.outputs.summary || 'No outcome output was produced; inspect setup and workflow logs.' }}

        Claude Code 2.1.267 · claude-sonnet-5 · max 40 turns / $5 / 15 minutes for the agent.
        Independent checks cover the cart in Metro, the agent export, and a fresh export.
        [Workflow and artifacts](${{ workflow.url }}) include the normalized Vitest report, raw stream, stderr, source diff, screenshots, and mechanical trace diagnostics.
