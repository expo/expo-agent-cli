# Temporary: loops the guarded-argv e2e test on Windows. Delete before merge.
name: tmp windows guarded argv
on:
  push:
    branches: [vonovak/windows-guarded-argv-trace]
jobs:
  loop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: bun install --ignore-scripts --frozen-lockfile
      - run: bun run build
        working-directory: packages/@expo/agent-cli
      - name: Loop the test
        shell: bash
        working-directory: packages/@expo/agent-cli
        run: |
          fails=0
          for i in $(seq 1 ${LOOPS:-10}); do
            echo "::group::iteration $i"
            bun run test:e2e -- cloud-binding-test -t "round-trips guarded cloud target argv" || fails=$((fails+1))
            echo "::endgroup::"
          done
          echo "failures: $fails"
          test $fails -eq 0
