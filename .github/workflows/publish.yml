# npm trusted publishing (OIDC). No NPM_TOKEN.
# One-time setup: npmjs.com → expo-agent-cli → Settings → Trusted Publisher
#   Organization or user: expo
#   Repository: expo-agent-cli
#   Workflow filename: publish.yml
#   Allowed actions: npm publish

name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag
        required: false
        default: latest

permissions: {}

jobs:
  publish:
    if: github.repository == 'expo/expo-agent-cli'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: bun install
      - run: bun test
      - run: bun run bundle

      - name: Publish to npm
        env:
          NPM_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$NPM_TAG"
          case "$tag" in
            '' | *[!A-Za-z0-9._-]*)
              echo "Invalid npm dist-tag: $tag"
              exit 1
              ;;
          esac
          npm publish --ignore-scripts --tag "$tag"
