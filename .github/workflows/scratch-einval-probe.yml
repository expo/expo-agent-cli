name: scratch einval probe
on:
  push:
    branches: [vonovak/scratch-einval-probe]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        node: ['24.22.2', '24.22.3']
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --ignore-scripts --frozen-lockfile
      - run: bun run build
        working-directory: packages/@expo/agent-cli
      - name: Run the stop-test step 60 times
        working-directory: packages/@expo/agent-cli
        run: |
          node -v
          fail=0; einval=0
          for i in $(seq 1 60); do
            if bun run test:e2e -- stop-test -t "after a SIGKILL of a foreground dev" > run.log 2>&1; then :; else
              fail=$((fail+1)); echo "run $i FAIL"; grep -E 'EINVAL|process.exit unexpectedly|Error: ' run.log | head -5
              grep -q 'setTypeOfService EINVAL' run.log && einval=$((einval+1))
            fi
          done
          echo "PROBE node=$(node -v) failures=$fail einval=$einval"
