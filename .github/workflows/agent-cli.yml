name: Expo Agent CLI

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cancellation-proof:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --ignore-scripts --frozen-lockfile
      - name: Build @expo/agent-cli
        id: build
        run: bun run build
        working-directory: packages/@expo/agent-cli
      - name: Trace fingerprint, recovery, and shipped plan stops
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NODE_OPTIONS: --require "${{ github.workspace }}/scripts/diagnostics/trace-managed-stop.cjs"
          AGENT_NATIVE_STOP_TRACE_DIR: ${{ runner.temp }}/managed-stop-traces
        run: bun run test:e2e -- dev-detached-owner-test dev-owned-stop-test -t "fingerprinting|manually quiesced|shipped EAS plan"
        working-directory: packages/@expo/agent-cli
      - name: Trace successful held-session stop schedules
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NODE_OPTIONS: --require "${{ github.workspace }}/scripts/diagnostics/trace-managed-stop.cjs"
          AGENT_NATIVE_STOP_TRACE_DIR: ${{ runner.temp }}/managed-stop-traces
        run: bun run test:e2e -- dev-owned-stop-test -t "keeps the owner.*failure..false"
        working-directory: packages/@expo/agent-cli
      - name: Save native operation traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-managed-stop-traces
          path: ${{ runner.temp }}/managed-stop-traces
          if-no-files-found: error
