name: Windows detached stop native timeout probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  native-timeout:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      AGENT_NATIVE_TIMEOUT_TRACE_DIR: ${{ runner.temp }}/native-timeout-probe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --ignore-scripts --frozen-lockfile
      - name: Build @expo/agent-cli
        run: bun run build
        working-directory: packages/@expo/agent-cli
      - name: Trace the native timeout row
        id: probe
        run: |
          New-Item -ItemType Directory -Force -Path $env:AGENT_NATIVE_TIMEOUT_TRACE_DIR | Out-Null
          $tracePath = (Join-Path $env:GITHUB_WORKSPACE 'scripts/diagnostics/trace-native-timeout.cjs').Replace('\', '/')
          $env:NODE_OPTIONS = '--require "' + $tracePath + '"'
          bun run test:e2e -- dev-owned-stop-test -t 'keeps the owner.*nativeTimeout..true'
        working-directory: packages/@expo/agent-cli
      - name: Save fixture files that still exist
        if: ${{ always() && steps.probe.outcome != 'skipped' }}
        run: |
          $directory = $env:AGENT_NATIVE_TIMEOUT_TRACE_DIR
          if (!(Test-Path -LiteralPath $directory)) { exit 0 }
          $roots = Get-ChildItem -LiteralPath $directory -Filter '*.jsonl' -File |
            ForEach-Object { Get-Content -LiteralPath $_.FullName } |
            Where-Object { $_.Contains('"event":"fixture-launch"') } |
            ForEach-Object { ($_ | ConvertFrom-Json).root } |
            Sort-Object -Unique
          foreach ($root in $roots) {
            $name = Split-Path (Split-Path $root -Parent) -Leaf
            $destination = Join-Path $directory $name
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            foreach ($file in @('owned-stop.jsonl', 'control.jsonl', 'spawned.jsonl')) {
              $source = Join-Path $root $file
              if (Test-Path -LiteralPath $source) {
                Copy-Item -LiteralPath $source -Destination $destination
              }
            }
          }
      - name: Upload native timeout traces
        if: ${{ always() && steps.probe.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-native-timeout-probe
          path: ${{ runner.temp }}/native-timeout-probe
          if-no-files-found: error
