name: Expo Agent CLI

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cancellation-proof:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --ignore-scripts --frozen-lockfile
      - name: Build @expo/agent-cli
        id: build
        run: bun run build
        working-directory: packages/@expo/agent-cli
      - name: Unit tests
        run: bun run test
        working-directory: packages/@expo/agent-cli
      - name: Ownership, cancellation, captured cleanup
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run test:e2e -- dev-detached-owner-test dev-owned-stop-test cloud-binding-test stop-test
        working-directory: packages/@expo/agent-cli
      - name: Verify actual stopped processes
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run test:e2e -- dev-detach-test -t "is stopped by dev:stop, which takes the whole tree with it"
        working-directory: packages/@expo/agent-cli
