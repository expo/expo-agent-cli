name: Expo Agent CLI

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  windows-detached-stop-probe:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --ignore-scripts --frozen-lockfile
      - name: Build @expo/agent-cli
        run: bun run build
        working-directory: packages/@expo/agent-cli
      - name: Probe detached stop
        run: bun run test:e2e -- windows-detached-stop-probe-test
        working-directory: packages/@expo/agent-cli
        env:
          AGENT_CLI_STOP_PROBE_ARTIFACT_DIR: ${{ runner.temp }}/detached-stop-probe
      - name: Preserve process evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-detached-stop-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/detached-stop-probe/
          if-no-files-found: warn
          retention-days: 7
