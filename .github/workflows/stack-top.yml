# A stacked PR is based on the PR below it, so the top PR's head holds every layer of the stack.
# CI runs there once for the whole stack and the layers below skip. Every other event (push,
# dispatch, schedule) and every PR outside a stack runs as before.
#
# The top PR re-runs whenever a lower layer changes, because `gh stack` rebases and pushes every
# branch above the change. A layer that becomes the top because the PR above it was closed has to
# be re-run by hand: the decision is made live, so "Re-run all jobs" is enough.
name: Stack top

on:
  workflow_call:
    outputs:
      run:
        description: "'true' when the calling workflow should run its jobs on this event"
        value: ${{ jobs.position.outputs.run }}

jobs:
  position:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.position.outputs.run }}
    steps:
      - name: 🥞 Find this PR's place in its stack
        id: position
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail

          decide() {
            echo "run=$1" >> "$GITHUB_OUTPUT"
            echo "$2" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          if [ "$EVENT" != pull_request ]; then
            decide true "Not a pull request. CI runs."
          fi

          # Prints "<stack number> <position> <size> <top open PR>", or nothing for a PR outside a stack.
          stack_of_pr() {
            gh api graphql \
              -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -F number="$PR" \
              -f query='query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    stackEntry { position }
                    stack { number entries(first: 100) { nodes { position pullRequest { number state } } } }
                  }
                }
              }' \
              --jq '.data.repository.pullRequest
                | if .stack == null then "" else
                    (.stack.entries.nodes | map(select(.pullRequest.state == "OPEN")) | max_by(.position)) as $top
                    | "\(.stack.number) \(.stackEntry.position) \(.stack.entries.nodes | length) \($top.pullRequest.number // "none")"
                  end'
          }

          stack=$(stack_of_pr) || decide true "Could not read the stack of PR #$PR. CI runs."

          # `gh stack submit` opens every PR first and links them into a stack last, so a PR that
          # was just opened may not show its stack yet. Give the link a minute to land.
          if [ "$ACTION" = opened ]; then
            for _ in 1 2 3 4 5 6; do
              [ -n "$stack" ] && break
              sleep 10
              stack=$(stack_of_pr) || decide true "Could not read the stack of PR #$PR. CI runs."
            done
          fi

          if [ -z "$stack" ]; then
            decide true "PR #$PR is not in a stack. CI runs."
          fi

          read -r number position size top <<< "$stack"
          if [ "$top" = none ]; then
            decide true "PR #$PR has no open layer in stack #$number. CI runs."
          fi
          if [ "$top" = "$PR" ]; then
            decide true "PR #$PR is the top open layer ($position of $size) of stack #$number. CI runs here for the whole stack."
          fi
          decide false "PR #$PR is layer $position of $size in stack #$number. CI runs on the top PR, #$top."
