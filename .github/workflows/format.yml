# Repository checks run on every pull request with no path filter. The package workflow does
# not run the release-script or alias-launcher tests, and skips changes confined to those paths.
name: Format

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    uses: ./.github/workflows/stack-gate.yml

  oxfmt:
    needs: [stack]
    if: needs.stack.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🥟 Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: 📦 Install dependencies
        run: bun install --ignore-scripts --frozen-lockfile
      - name: 💅 Check formatting
        run: bun run format:check
      - name: 🧪 Test repository scripts and alias launcher
        if: ${{ !cancelled() }}
        run: bun run test:repo
