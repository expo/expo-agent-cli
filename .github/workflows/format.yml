# oxfmt covers the whole repo, so this runs on every pull request with no path filter.
# The agent-cli workflow only triggers on packages/@expo/agent-cli/**, which would leave
# scripts/ and packages/expo-agent-cli/ unchecked.
name: Format

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oxfmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🥟 Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: 📦 Install dependencies
        run: bun install --ignore-scripts --frozen-lockfile
      - name: 💅 Check formatting
        run: bun run format:check
