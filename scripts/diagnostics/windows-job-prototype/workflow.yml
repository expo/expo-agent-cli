name: Windows native job prototype

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-job-probe:
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      PROBE_DIRECTORY: ${{ github.workspace }}\scripts\diagnostics\windows-job-prototype
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Compile isolated Win32 helper with installed MSVC
        shell: pwsh
        run: '& "$env:PROBE_DIRECTORY\build.ps1"'
      - name: Run actual Node controller and local fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node "$env:PROBE_DIRECTORY\controller.mjs" "$env:PROBE_DIRECTORY\job-helper.exe" "$env:PROBE_DIRECTORY\results" 2>&1 | Tee-Object -FilePath "$env:PROBE_DIRECTORY\results\controller.log"
          exit $LASTEXITCODE
      - name: Upload native observations and exact executable
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-job-prototype-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            scripts/diagnostics/windows-job-prototype/results/
            scripts/diagnostics/windows-job-prototype/job-helper.exe
            scripts/diagnostics/windows-job-prototype/job-helper.cpp
            scripts/diagnostics/windows-job-prototype/controller.mjs
            scripts/diagnostics/windows-job-prototype/fixture.mjs
            scripts/diagnostics/windows-job-prototype/build.ps1
            scripts/diagnostics/windows-job-prototype/README.md
            scripts/diagnostics/windows-job-prototype/MANIFEST.sha256
            .github/workflows/agent-cli.yml
